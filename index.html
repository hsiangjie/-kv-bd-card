<style>
*{box-sizing:border-box} :root{color-scheme:dark;--ink:#171411;--cream:#fff0d7;--orange:#ff8548;--muted:#c9ae98}
body{margin:0;background:radial-gradient(ellipse at 75% 25%,#4b291b,transparent 48%),#161311;color:var(--cream);font-family:system-ui,sans-serif;min-height:100svh}
main{width:min(1120px,calc(100% - 40px));margin:auto;padding:30px 0 50px}
header{border-bottom:1px solid #ffffff26;display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;font:italic 900 24px system-ui;letter-spacing:.1em}header span{font:600 11px system-ui;letter-spacing:.22em;color:var(--muted)}
.layout{display:grid;grid-template-columns:1fr 1.12fr;align-items:center;gap:clamp(28px,6vw,90px);margin-top:42px}
.eyebrow{color:var(--orange);font:700 12px system-ui;letter-spacing:.28em}
h1{font-size:clamp(35px,5.4vw,74px);line-height:1.12;letter-spacing:-.055em;margin:16px 0}h1 em{color:var(--orange);font-style:normal}
p{line-height:1.7;color:var(--muted)}.intro>p{max-width:30ch}
.collection{margin-top:30px;border-top:1px solid #ffffff26;padding-top:15px}.collection h2{font-size:14px;margin:0 0 12px}.collection h2 span{color:var(--orange);margin-left:8px}
.slots{display:flex;gap:7px;flex-wrap:wrap}.slots button{font-size:12px;padding:8px 10px}.slots button:disabled{border-style:dashed;color:#ccb29e;background:transparent;opacity:.68}
.machine{padding:10px;border:1px solid #e4a974;border-radius:24px;background:linear-gradient(150deg,#b25634,#713b2c 40%,#39241e);box-shadow:0 22px 60px #080604aa,inset 0 0 0 4px #1e140d70}
.marquee{text-align:center;padding:13px 4px;background:#201813;border-radius:15px 15px 4px 4px;color:#ffba80;font:italic 900 clamp(20px,3vw,33px) system-ui;letter-spacing:.11em;text-shadow:0 0 20px #ff784d88;border:1px solid #d5946270}
.glass{position:relative;height:clamp(235px,35vw,365px);overflow:hidden;touch-action:pan-y;background:linear-gradient(117deg,transparent 27%,#ffdeaa10 28% 35%,transparent 36% 62%,#ffdec50c 63% 67%,transparent 68%),radial-gradient(ellipse at 50% 100%,#71442b,#38271f 65%,#201b19);border:1px solid #ffd1a777;border-top:0;box-shadow:inset 0 8px 22px #0807068c}
.court{position:absolute;inset:auto 9% 0;height:43%;border:1px solid #ffcf9c33;transform:perspective(180px) rotateX(39deg);transform-origin:bottom;background:linear-gradient(90deg,transparent 49.8%,#ffcf9c33 50%,transparent 50.3%)}
.rail{position:absolute;top:16px;inset-inline:6%;height:4px;border-radius:8px;background:linear-gradient(#e9af83,#7e5136)}
.claw{position:absolute;z-index:2;top:16px;left:50%;width:44px;transform:translateX(-50%);transition:left .16s ease;pointer-events:none}
.wire{height:40px;background:linear-gradient(90deg,#786253,#fbd4b6,#745943);width:3px;margin:auto;transition:height .53s ease-in-out}
.head{position:relative;width:22px;height:13px;margin:auto;border-radius:5px;background:linear-gradient(#fff0d1,#9a7052);box-shadow:0 2px 6px #0008}
.head:before,.head:after{content:"";position:absolute;top:9px;width:13px;height:21px;border:3px solid #ffd7b4;border-top:0;border-radius:0 0 9px 9px;transition:transform .24s}
.head:before{left:-8px;transform:rotate(25deg);border-right:0}.head:after{right:-8px;transform:rotate(-25deg);border-left:0}
.gripping .head:before{transform:translateX(4px) rotate(-14deg)}.gripping .head:after{transform:translateX(-4px) rotate(14deg)}
.gift{position:absolute;bottom:22px;width:clamp(32px,8vw,58px);height:clamp(34px,8vw,60px);translate:-50% 0;border-radius:5px 5px 9px 9px;background:linear-gradient(90deg,transparent 42%,#ffe2ab 42% 58%,transparent 58%),linear-gradient(145deg,var(--light),var(--box));box-shadow:inset 0 2px #ffffff66,inset -4px -6px #180b092b,0 7px 12px #1b110dc4;display:grid;place-items:center;color:#25180f;font-size:19px;font-weight:900;transition:bottom .53s ease-in-out,opacity .24s;pointer-events:none}
.gift:before{content:"";position:absolute;width:114%;height:22%;top:0;border-radius:4px;background:linear-gradient(90deg,var(--light) 43%,#ffe2ab 43% 57%,var(--light) 57%);box-shadow:0 3px 4px #20100840}
.gift:after{content:"";position:absolute;top:-12px;width:20px;height:12px;border:3px solid #ffe2ab;border-radius:10px 10px 3px 3px}
.panel{background:#241b17;border-radius:0 0 15px 15px;padding:15px 12px 11px}.controls{display:grid;grid-template-columns:1fr 1fr 2.4fr;gap:8px}button{cursor:pointer;border-radius:9px;border:1px solid #9b7057;background:#3a2b23;color:var(--cream);font:700 15px system-ui;padding:10px 12px;min-height:42px}button:hover:enabled{filter:brightness(1.16)}button:focus-visible{outline:2px solid #fff;outline-offset:3px}button:disabled{cursor:default;opacity:.5}.drop{background:#ff914f;color:#23130b;border-color:#ffb47e;box-shadow:inset 0 -3px #b74b27}
.status{font-size:12px;margin:10px 0 0;text-align:center;min-height:2em}
dialog{width:min(450px,calc(100% - 28px));max-height:calc(100% - 28px);border:1px solid #b96e44;border-radius:16px;background:#fbedd6;color:#231811;padding:28px;box-shadow:0 30px 90px #0008}dialog::backdrop{background:#1a100cd9}dialog h2{font-size:30px;margin:12px 0}dialog p{color:#593d2f}dialog .eyebrow{color:#943f1d}dialog .close{float:right;background:transparent;color:#41291e;border-color:#a5806c}dialog .card-icon{display:block;font-size:34px;margin-top:24px}
.reset{background:transparent;border:0;padding:8px 0;color:var(--muted);font-size:12px;text-decoration:underline}
@media(min-width:721px){.layout{column-gap:clamp(28px,6vw,90px);row-gap:0}.intro{align-self:end}.machine{grid-column:2;grid-row:1 / 3}.collection{align-self:start}}
@media(max-width:720px){main{width:min(490px,calc(100% - 24px));padding-top:16px}.layout{display:contents}.intro{display:contents}.intro .eyebrow{display:block;margin-top:20px}h1{margin:8px 0}.intro>p{margin:4px 0 16px;max-width:none;font-size:14px}.collection{margin-top:17px}.machine{margin-top:12px}.glass{height:clamp(220px,63vw,300px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}

:root{color-scheme:light;--cream:#fff2d8;--muted:#becedb;--orange:#ff9145}
body{background:radial-gradient(ellipse at 85% 20%,#263e5a,transparent 40%),radial-gradient(ellipse at 15% 90%,#193849,transparent 43%),#101d2d}
header{font:italic 700 28px system-ui,sans-serif;letter-spacing:-.04em;color:#ffac63;border-color:#425976}header span{font:600 11px system-ui;letter-spacing:.14em}
h1{font-family:system-ui,sans-serif;line-height:1.17}.collection{border-color:#425976}.machine{background:linear-gradient(115deg,#506780,#233954 45%,#12263c);border:2px solid #607793;box-shadow:0 17px 0 -7px #172a41,0 24px 35px -12px #7d3b3b55,inset 0 0 0 4px #839aaf;padding:11px;border-radius:32px 32px 20px 20px}
.marquee{background:radial-gradient(circle,#ffe7a1 0 2px,transparent 3px) left 3px top 2px / 18px 8px repeat-x,#192a40;color:#fff6d7;border:2px solid #ffa24a;border-radius:21px 21px 6px 6px;font:italic bold clamp(30px,3.8vw,48px) system-ui,sans-serif;letter-spacing:-.04em;text-shadow:0 2px #643746;padding:13px 0 8px}
.glass{background:radial-gradient(ellipse at 18% 40%,#fff8e6 0 4%,transparent 4.4%),linear-gradient(#507e9b,#abc9cf 64%,#e9cd95 64%);border:2px solid #506781;box-shadow:inset 0 0 18px #76544933}
.glass:after{content:"";pointer-events:none;position:absolute;bottom:0;left:0;right:0;height:17px;background:radial-gradient(ellipse at top,#fff0cd 0 65%,transparent 68%) 0 0/23px 10px repeat-x,#e4853e}
.awning{position:absolute;top:0;width:100%;height:16px;background:repeating-linear-gradient(90deg,#ea843f 0 19px,#fff1d0 19px 38px);border-bottom:2px solid #344961}
.wheel{position:absolute;right:5%;top:17%;width:32%;aspect-ratio:1;border:4px double #365471;border-radius:50%;opacity:.5;background:repeating-conic-gradient(from 10deg,transparent 0deg 43deg,#476682 43deg 45deg)}
.wheel:after{content:"";position:absolute;inset:49% 33% -40%;background:#547587;clip-path:polygon(47% 0,58% 0,100% 100%,86% 100%,51% 19%,14% 100%,0 100%)}
.rail{top:16px;background:#9a7771}.panel{background:#21344d;border:1px solid #59748c}.controls button,.slots button{background:#2e4961;color:#fff2d8;border-color:#71889c}.controls .drop,dialog .drop{background:#ff9044;color:#192436;border-color:#e7772a}.slots button:disabled{color:#d0dfeb}.gift{width:17%;height:auto;aspect-ratio:200/220;max-width:85px;background-color:transparent;background-size:contain;background-position:center bottom;background-repeat:no-repeat;border-radius:0;box-shadow:none;filter:drop-shadow(0 3px 2px #78553a45)}.gift:before,.gift:after{display:none}dialog{background:#fff4df;border:2px solid #bd7b43}dialog .card-icon{width:100px;height:110px;background-size:contain;background-repeat:no-repeat}

.gift, dialog .card-icon {
  background-color: transparent;
  background-position: center;
  background-size: contain;
  border: 0;
  outline: 0;
  border-radius: 0;
}
.gift::after {
  content: attr(data-number);

  inset: auto 1px -5px auto;
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  border: 1px solid #fff2d8;
  border-radius: 50%;
  background: #20364e;
  color: #fff2d8;
  font: 700 11px system-ui;
}

.basket{position:relative;margin:32px 2px 8px;padding:8px 7px 16px;border:2px solid #bd7940;border-top:7px solid #ffc27f;border-radius:9px 9px 24px 24px;background:repeating-linear-gradient(0deg,#814727 0 2px,transparent 2px 7px),repeating-linear-gradient(100deg,#a96434 0 8px,#b97741 8px 15px);box-shadow:inset 0 -5px #794426,0 6px 9px #08132040}
.basket::before{content:"";position:absolute;left:27%;right:27%;height:17px;bottom:calc(100% + 5px);border:5px solid #d28a4b;border-bottom:0;border-radius:36px 36px 0 0}
.basket .slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.basket .slots button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0;padding:5px 1px 6px;min-height:76px;border:1px solid #daa265;border-radius:5px 5px 10px 10px;background:#233951;color:#fff1d8;font-size:clamp(10px,2.8vw,12px);line-height:1.3}
.basket .slots button:disabled{opacity:1;cursor:default}
.basket .slots button[data-empty="true"]{border:1px dashed #bd926a;background:#553f33;color:#f7e0c3}
.basket .slots button::before{content:"";display:block;width:90%;height:44px;background:var(--photo) center bottom/contain no-repeat}
.basket .slots button[data-empty="true"]::before{width:19px;height:19px;margin:auto;border:1px dashed #c9a483;border-radius:50%;background:none}
.flying-dog{pointer-events:none;position:fixed;z-index:10;transform-origin:center;background:center/contain no-repeat}
dialog{padding:clamp(16px,4vw,24px);max-height:92dvh;overflow:auto}

#portrait:not([hidden]){display:block;width:auto;max-width:100%;height:auto;max-height:min(47dvh,440px);margin:0 auto 14px;border-radius:6px;box-shadow:0 3px 10px #44322525}

header .ticket{display:inline-flex;align-items:center;flex:none;color:#20344a;background:#ffd99a;border-block:2px solid #e6994f;letter-spacing:.04em;font:700 12px system-ui;transform:rotate(2deg);mask:radial-gradient(circle at left center,transparent 3px,#000 3.6px) left/51% 100% no-repeat,radial-gradient(circle at right center,transparent 3px,#000 3.6px) right/51% 100% no-repeat}
.ticket b,.ticket time{padding:7px 9px}.ticket time{border-left:1px dashed #97643a;font-weight:800}

@keyframes head-rock{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.claw{transform-origin:50% 0}.claw:not(.dropping){animation:claw-sway 1.6s ease-in-out infinite alternate}

@media(max-width:720px){.birthday-title h1{font-size:clamp(33px,8.7vw,44px)}.birthday-head{width:clamp(64px,20vw,92px);margin-right:9px}}

#cardSheet.voucher{position:relative;margin:20px 7px 8px;padding:30px 10px 28px;text-align:center;background:linear-gradient(90deg,#e8c68d,#fff2ce 15%,#fff3d6 80%,#edd09d);border-inline:1px solid #b98a50;color:#573514;box-shadow:0 5px 10px #77481925;transform-origin:top;animation:unroll .65s cubic-bezier(.22,.7,.2,1) both}
.voucher::before,.voucher::after{content:"";position:absolute;inset-inline:-6px;height:14px;border:1px solid #96602d;border-radius:7px;background:linear-gradient(#8c572b,#edc68e 30%,#d29a59 60%,#855026)}
.voucher::before{top:0}.voucher::after{bottom:0}
.voucher #cardTitle{font-family:Georgia,"Songti TC",serif;color:#583518}
.voucher #validity{display:inline-block;margin:15px 0 0;padding:3px 12px;color:#87491e;border-block:1px solid #cba471;font-size:14px}
@keyframes unroll{from{transform:scaleY(.08);opacity:.4}to{transform:scaleY(1);opacity:1}}
@media(prefers-reduced-motion:reduce){#cardSheet.voucher{animation:none}}

const gifts = [
  {
    "name": "蛋糕來來",
    "title": "第一口蛋糕，留給 Kevin",
    "text": "Kevin，11 月 24 日生日快樂！今天蛋糕上那顆最漂亮的草莓，誰都別跟你搶。",
    "photo": 0
  },
  {
    "name": "我要吃飯飯",
    "title": "這張券可以偷懶一天",
    "text": "送你一張生日偷懶券。今天可以晚一點回訊息、多賴十分鐘的床，把下午留給最想做的事。",
    "photo": 1
  },
  {
    "name": "禮物小狗",
    "title": "下一站，去兜風",
    "text": "新的一歲，願你有幾次說走就走的小旅行。就算只是繞路去買一球冰淇淋，也算一次冒險。",
    "photo": 2
  },
  {
    "name": "汪卡片外送",
    "title": "留一張合照",
    "hasPortrait": true,
    "text": "大胖胖豬豬生日快樂，祝你天天開心喔喔喔",
    "photo": 3
  },
  {
    "name": "許願禮物卷",
    "title": "生日禮物兌換卷",
    "validity": "期限：100天",
    "text": "不限金額禮物一個。",
    "photo": 4
  }
];
const $ = id => document.getElementById(id);
const glass = $('glass'), claw = $('claw'), wire = $('wire'), card = $('card');
const position = index => 12 + index * 19;
const collected = new Set();
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const pause = ms => new Promise(resolve => setTimeout(resolve, reduced.matches ? 0 : ms));
let aim = 50, busy = false, active = 0;
const prizes = gifts.map((gift, index) => {
  const prize = document.createElement('div');
  prize.className = 'gift';
  prize.setAttribute('aria-hidden', 'true');
  prize.dataset.number = String(index + 1);
  prize.style.left = position(index) + '%';


  prize.style.backgroundImage = 'url(' + dogPhotos[gift.photo] + ')';
  glass.append(prize);
  return prize;
});
const slots = gifts.map((gift, index) => {
  const button = document.createElement('button');
  button.addEventListener('click', () => showCard(index, true));
  $('slots').append(button);
  return button;
});
function refresh() {
  slots.forEach((button, index) => {
    const found = collected.has(index);
    button.disabled = busy || !found;
    button.dataset.empty = String(!found);
    button.style.setProperty('--photo', found ? 'url(' + dogPhotos[gifts[index].photo] + ')' : 'none');
    button.textContent = found ? gifts[index].name : '待夾取';
  });
  $('count').textContent = collected.size + ' / ' + gifts.length;
  const finished = collected.size === gifts.length;
  $('reset').hidden = !finished;
  $('drop').disabled = busy || finished;
  $('left').disabled = $('right').disabled = busy || finished;
}
function move(next) {
  if (busy || collected.size === gifts.length) return;
  aim = Math.min(94, Math.max(6, next));
  claw.style.left = aim + '%';
}
function showCard(index, opened = false) {
  active = index;
  const gift = gifts[index];
  $('cardIcon').style.backgroundImage = 'url(' + dogPhotos[gift.photo] + ')';
  $('portrait').hidden = !gift.hasPortrait;
  $('cardSheet').classList.remove('voucher');
  $('validity').hidden = true;
  $('open').textContent = gift.validity ? '打開禮物卷' : '拆開卡片';
  $('cardTitle').textContent = gift.name;
  $('cardText').hidden = true;
  $('open').hidden = false;
  card.showModal();
  if (opened) reveal();
}
function reveal() {
  const gift = gifts[active];
  if (gift.validity) {
    $('cardSheet').classList.add('voucher');
    $('validity').textContent = gift.validity;
    $('validity').hidden = false;
  }
  $('cardTitle').textContent = gift.title;
  $('cardText').textContent = gift.text;
  $('cardText').hidden = false;
  $('open').hidden = true;
  card.querySelector('.close').focus();
}
async function landInBasket(prize, index) {
  const start = prize.getBoundingClientRect();
  const flyer = document.createElement('div');
  flyer.className = 'flying-dog';
  flyer.setAttribute('aria-hidden', 'true');
  Object.assign(flyer.style, {
    left: start.left + 'px', top: start.top + 'px',
    width: start.width + 'px', height: start.height + 'px',
    backgroundImage: prize.style.backgroundImage
  });
  prize.style.visibility = 'hidden';
  document.body.append(flyer);
  try {
    const slot = slots[index];
    slot.scrollIntoView({block:'nearest', behavior:reduced.matches ? 'instant' : 'smooth'});
    if (reduced.matches) return;
    const began = performance.now();
    await new Promise(resolve => {
      function frame(now) {
        const progress = Math.min(1, (now - began) / 900);
        const target = slot.getBoundingClientRect();
        const x = (target.left + target.width / 2 - start.left - start.width / 2) * progress;
        const y = (target.top + 27 - start.top - start.height / 2) * progress - 52 * Math.sin(Math.PI * progress);
        flyer.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + (1 - 0.45 * progress) + ')';
        if (progress === 1) resolve();
        else requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  } finally {
    flyer.remove();
    prize.style.visibility = '';
  }
}
async function drop() {
  if (busy || collected.size === gifts.length) return;
  busy = true;
  claw.classList.add("dropping");
  refresh();
  $('status').textContent = '夾爪下降中…';
  const index = gifts.findIndex((_, i) => !collected.has(i) && Math.abs(position(i) - aim) <= 8);
  const prize = index < 0 ? null : prizes[index];
  const height = glass.clientHeight - 22 - prizes.find(item => !item.hidden).offsetHeight - 40;
  wire.style.height = Math.max(60, height) + 'px';
  await pause(560);
  claw.classList.add('gripping');
  await pause(240);
  wire.style.height = '';
  if (prize) prize.style.bottom = Math.max(22, 22 + height - 40) + 'px';
  await pause(560);
  claw.classList.remove('gripping');
  if (prize) {
    $('status').textContent = '夾到了！送進籃子…';
    await landInBasket(prize, index);
    prize.hidden = true;
    prize.style.display = 'none';
    collected.add(index);
    refresh();
    await pause(480);
  }
  busy = false;
  claw.classList.remove("dropping");
  refresh();
  $('status').textContent = collected.size === gifts.length ? '五隻娃娃都集齊了！Kevin，生日快樂！' :
    prize ? '夾到了！還有 ' + (gifts.length - collected.size) + ' 隻娃娃。' : '差一點！對準還在場上的娃娃再試一次。';
  if (prize) showCard(index);
  else $('drop').focus();
}
$('left').onclick = () => move(aim - 19);
$('right').onclick = () => move(aim + 19);
$('drop').onclick = drop;
$('open').onclick = reveal;
glass.addEventListener('click', event => {
  const bounds = glass.getBoundingClientRect();
  move(100 * (event.clientX - bounds.left) / bounds.width);
});
document.addEventListener('keydown', event => {
  if (card.open || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    move(aim + (event.key === 'ArrowRight' ? 19 : -19));
  }
});
card.addEventListener('close', () => {
  if (!card.contains(document.activeElement) && document.activeElement !== document.body) return;
  const target = collected.size === gifts.length ? slots[active] : $('drop');
  target.focus();
});
$('reset').onclick = () => {
  collected.clear();
  prizes.forEach(prize => {
    prize.hidden = false;
    prize.style.display = '';
    prize.style.bottom = '';
  });
  move(50);
  refresh();
  $('status').textContent = '用左右鍵移動，或直接點玻璃裡的娃娃。';
  $('drop').focus();
};
refresh();
</script>
